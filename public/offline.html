<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0D2B7E" />
    <title>همیان | آفلاین</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f7fc;
        color: #0b1736;
        font-family: Vazirmatn, Tahoma, sans-serif;
      }
      main {
        width: min(420px, 100%);
        background: #fff;
        border: 1px solid #d5e3f5;
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(6, 27, 120, 0.08);
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: #fff;
      }
      h1 { margin: 16px 0 8px; font-size: 1.35rem; color: #061b78; }
      p { margin: 0; line-height: 1.7; color: #5c6d8a; }
      button {
        margin-top: 18px;
        border: 0;
        border-radius: 12px;
        background: #0755e9;
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="همیان" />
      <h1>اتصال اینترنت قطع است</h1>
      <p>همیان باز می‌ماند. وقتی شبکه برگشت، دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
